name: Desktop release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:electron
      - run: npx tsc --noEmit
      - run: npm run test:ocr
      - run: npm run test:deep-reading
      - run: npm run desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          make_latest: true
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
