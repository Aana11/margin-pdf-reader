name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run lint:electron
      - run: npx tsc --noEmit
      - run: npm run test:ocr
      - run: npm run test:deep-reading
      - run: npm run test:region-reading
      - run: npm run test:index-resume
      - run: npm run test:index-tasks
      - run: npm run test:workspace
      - run: npm run test:knowledge-packs
      - run: npm run build
      - run: npx electron-builder --dir
      - run: npm run test:desktop
      - run: npm run test:desktop:ocr
      - run: npm run test:desktop:deep-reading
      - run: npm run test:desktop:region-reading
      - run: npm run test:desktop:model-association
      - run: npm run test:desktop:knowledge-packs
