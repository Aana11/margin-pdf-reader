name: Feature request
description: Propose a focused improvement to the reading workflow
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes: { label: Reading problem, description: Describe the user problem rather than only the proposed control. }
    validations: { required: true }
  - type: textarea
    attributes: { label: Proposed outcome }
    validations: { required: true }
  - type: textarea
    attributes: { label: Privacy and offline impact }
